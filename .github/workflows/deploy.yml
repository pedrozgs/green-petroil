
name: Publicar Green Petroil

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
        working-directory: green-petroil-angular

      - run: npx ng build --base-href /green-petroil/
        working-directory: green-petroil-angular

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: green-petroil-angular/dist/green-petroil/browser

      - uses: actions/deploy-pages@v4
